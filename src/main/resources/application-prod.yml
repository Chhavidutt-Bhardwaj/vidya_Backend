# ==============================================================
# Production Profile (Activated with SPRING_PROFILES_ACTIVE=prod)
# Direct environment variable bindings — same key structure as dev.
# ==============================================================

spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

vidya:
  datasource:
    master:
      url: jdbc:postgresql://localhost:5432/vidya_master
      username: postgres
      password: vidya@123
      hikari:
        pool-name: vidya-master-prod-pool
        maximum-pool-size: ${MASTER_DB_POOL_MAX:20}
        minimum-idle: ${MASTER_DB_POOL_MIN_IDLE:5}
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        auto-commit: false

  # Tenant DataSource pool defaults (applied per-tenant DataSource)
  tenant:
    datasource:
      hikari:
        pool-name-prefix: vidya-tenant-prod-
        maximum-pool-size: ${TENANT_DB_POOL_MAX:10}
        minimum-idle: ${TENANT_DB_POOL_MIN_IDLE:2}
        connection-timeout: 30000
        idle-timeout: 300000
        max-lifetime: 900000
        auto-commit: false
      cache:
        max-size: ${TENANT_CACHE_MAX_SIZE:500}
        ttl-minutes: ${TENANT_CACHE_TTL_MINUTES:60}

  # PostgreSQL admin connection used during tenant database provisioning
  provisioning:
    admin:
      url: jdbc:postgresql://localhost:5432/postgres
      username: postgres
      password: vidya@123
    # Tenant database location — server configuration only; never accepted from API clients (I0).
    tenant-db:
      host: ${TENANT_DB_HOST}
      port: ${TENANT_DB_PORT:5432}

  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD}
    ttl:
      tenant-registry-seconds: ${REDIS_TENANT_TTL:600}

  security:
    jwt:
      secret: VmlkeWFPU1N5c3RlbQ== #VidyaOSSystem
      expiry-seconds: ${JWT_EXPIRY_SECONDS:1800}           # 30 minutes
      refresh-expiry-seconds: ${JWT_REFRESH_EXPIRY_SECONDS:604800} # 7 days
    cors:
      allowed-origins: "*"

  payment:
    razorpay:
      key-id: ${RAZORPAY_KEY_ID}
      key-secret: ${RAZORPAY_KEY_SECRET}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}
    cashfree:
      app-id: ${CASHFREE_APP_ID}
      secret-key: ${CASHFREE_SECRET_KEY}

logging:
  level:
    root: INFO
    com.vidya: INFO
    org.flywaydb: INFO
    com.zaxxer.hikari: WARN
  # Log file on disk (in addition to the console/journald). LOG_PATH is set in /etc/vidya/vidya.env
  # by process.sh setup (default: <project dir>/logs).
  file:
    name: ${LOG_PATH:/opt/vidya/logs}/vidya.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] [%X{tenantId}] %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      # Rolls daily and whenever the file reaches max-file-size; old files are gzipped.
      file-name-pattern: ${LOG_PATH:/opt/vidya/logs}/archive/vidya-%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: ${LOG_MAX_FILE_SIZE:50MB}
      max-history: ${LOG_MAX_HISTORY_DAYS:30}
      total-size-cap: ${LOG_TOTAL_SIZE_CAP:2GB}
      clean-history-on-start: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

