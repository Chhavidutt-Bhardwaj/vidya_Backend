# ==============================================================
# Development Profile (Active by default for local development)
# ==============================================================

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

vidya:
  datasource:
    master:
      url: ${MASTER_DB_URL:jdbc:postgresql://localhost:5432/vidya_master}
      username: ${MASTER_DB_USER:postgres}
      password: ${MASTER_DB_PASS:0001}
      hikari:
        pool-name: vidya-master-dev-pool
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        auto-commit: false

  # Tenant DataSource pool defaults (applied per-tenant DataSource)
  tenant:
    datasource:
      hikari:
        pool-name-prefix: vidya-tenant-dev-
        maximum-pool-size: 5
        minimum-idle: 1
        connection-timeout: 30000
        idle-timeout: 300000
        max-lifetime: 900000
        auto-commit: false
      cache:
        max-size: 200          # max number of tenant DataSources in memory
        ttl-minutes: 30        # idle DataSource eviction TTL

  # PostgreSQL admin connection used during tenant database provisioning
  provisioning:
    admin:
      url: ${PROVISION_ADMIN_DB_URL:jdbc:postgresql://localhost:5432/postgres}
      username: ${PROVISION_DB_ADMIN_USER:postgres}
      password: ${PROVISION_DB_ADMIN_PASS:0001}

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    ttl:
      tenant-registry-seconds: 600    # 10 minutes

  security:
    jwt:
      secret: ${JWT_SECRET:vidya-dev-secret-key-change-in-production-min-256-bits}
      expiry-seconds: ${JWT_EXPIRY_SECONDS:86400}          # 24 hours
      refresh-expiry-seconds: ${JWT_REFRESH_EXPIRY_SECONDS:604800} # 7 days
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,http://localhost:8085}

  payment:
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:rzp_test_vidya_key}
      key-secret: ${RAZORPAY_KEY_SECRET:rzp_test_vidya_secret}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:rzp_test_webhook_secret}
    cashfree:
      app-id: ${CASHFREE_APP_ID:cf_test_vidya_app}
      secret-key: ${CASHFREE_SECRET_KEY:cf_test_vidya_secret}

logging:
  level:
    root: INFO
    com.vidya: DEBUG
    org.flywaydb: INFO
    com.zaxxer.hikari: INFO
