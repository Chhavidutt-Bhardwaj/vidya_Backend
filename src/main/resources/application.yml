server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: vidya

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Disable Spring Boot autoconfiguration for datasource (we configure manually)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration

  # JPA — base configuration (datasource-specific configs in MasterDataSourceConfig)
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        jdbc:
          time_zone: UTC

  # Flyway disabled globally — we control it programmatically
  flyway:
    enabled: false

  # Session via Redis
  session:
    store-type: redis
    timeout: 86400s   # 24 hours

# ==============================================================
# Base / Default Shared Configuration
# ==============================================================
vidya:
  security:
    login:
      max-failed-attempts: 5
      lockout-minutes: 15

  # Flyway migration locations
  flyway:
    master:
      locations: classpath:db/migration/master
    tenant:
      locations: classpath:db/migration/tenant

# ==============================================================
# Actuator
# ==============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: Vidya
    description: School Management System
    version: 0.0.1-SNAPSHOT

# ==============================================================
# SpringDoc OpenAPI
# ==============================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: com.vidya

# ==============================================================
# Logging
# ==============================================================
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] [%X{tenantId}] %-5level %logger{36} - %msg%n"
